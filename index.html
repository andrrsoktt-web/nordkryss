<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nordkryss">
<meta name="theme-color" content="#bfe0f0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Nordkryss — сканворды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --fjord:#1d3557; --fjord2:#274b73; --ice:#f4f8fb; --snow:#ffffff;
  --mist:#dfe9f2; --clue:#e7eef6; --clue-ink:#2c4565; --line:#b9c9da;
  --birch:#f6e7c8; --birch2:#e9d2a4; --birch-ink:#5a3e1b;
  --berry:#c8102e; --pine:#2f6b4f; --gold:#f2b632; --sel:#cfe4ff; --act:#8fc1ff;
  --ok:#3fae6a; --bad:#e04848; --ink:#1b2b3c;
  --cell:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fjord);color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* ---------- nordic backdrop ---------- */
.sky{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#bfe0f0 0%,#e6f3f8 55%,#f4f8fb 100%);overflow:hidden}
.sky svg{position:absolute;left:0;right:0;top:0;width:100%;height:auto}
.sky .aur{position:absolute;inset:-20% -10% auto -10%;height:60%;opacity:.55;filter:blur(18px);
  background:radial-gradient(60% 40% at 30% 40%,#7fe3c1 0%,transparent 70%),radial-gradient(50% 35% at 70% 30%,#9fd0ff 0%,transparent 70%);
  animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(6%) skewX(-6deg);opacity:.75}}
.sky.night{background:linear-gradient(180deg,#0f2440 0%,#1d3557 60%,#2a4a6f 100%)}
.sky.night .aur{opacity:.8}
.flake{position:absolute;top:-10px;color:#fff;opacity:.8;font-size:10px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* ---------- top bar ---------- */
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
.ibtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:18px;color:var(--fjord);box-shadow:0 2px 6px rgba(29,53,87,.18)}
.coins{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:20px;padding:5px 10px 5px 6px;font-weight:800;color:var(--fjord);box-shadow:0 2px 6px rgba(29,53,87,.18)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,#f2b632 55%,#c98a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-size:12px;color:#8a5a00}
.coins .plus{width:18px;height:18px;border-radius:50%;background:var(--fjord2);color:#fff;font-size:13px;display:grid;place-items:center}

/* ---------- versus ---------- */
.vs{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 6px;font-weight:700;color:var(--fjord);font-size:13px}
.vs .sc{min-width:52px;text-align:center;padding:4px 10px;border-radius:10px;background:#fff;font-size:17px;font-weight:900;box-shadow:0 2px 0 rgba(29,53,87,.15);transition:transform .2s}
.vs .me .sc{color:var(--fjord2);outline:2px solid var(--act)}
.vs .op .sc{color:#7b8aa0}
.vs .pl{display:flex;align-items:center;gap:6px}
.vs .bump{transform:scale(1.25)}
.vs .x{opacity:.6;font-size:11px}

/* ---------- board ---------- */
.boardwrap{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:0 6px;min-height:0}
.board{display:grid;gap:0;background:var(--line);border:2px solid var(--fjord2);border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(29,53,87,.25);touch-action:none}
.c{width:var(--cell);height:var(--cell);position:relative;background:var(--snow);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  display:grid;place-items:center;font-weight:900;font-size:calc(var(--cell)*.56);color:var(--ink);text-transform:uppercase;transition:background .15s}
.c.k{background:var(--clue);color:var(--clue-ink);font-weight:800;text-transform:uppercase;font-size:calc(var(--cell)*.155);line-height:1.05;padding:1px;text-align:center;overflow:hidden;letter-spacing:-.02em;cursor:pointer}
.c.k .half{position:absolute;left:0;right:0;height:50%;display:grid;place-items:center;padding:1px 2px;overflow:hidden}
.c.k .half.t{top:0;border-bottom:1px solid var(--line)}
.c.k .half.b{bottom:0}
.c.k .full{position:absolute;inset:0;display:grid;place-items:center;padding:2px}
.c.k img{width:92%;height:92%;object-fit:contain;pointer-events:none}
.c.k .half img{width:auto;height:96%}
.c.k .emo{font-size:calc(var(--cell)*.62);line-height:1}
.c.k .half .emo{font-size:calc(var(--cell)*.34)}
.c.k .ar{position:absolute;width:0;height:0;border:4px solid transparent}
.c.k .ar.r{right:-1px;border-left:5px solid var(--clue-ink);border-right:0}
.c.k .ar.d{bottom:-1px;border-top:5px solid var(--clue-ink);border-bottom:0}
.c.k.sel{background:#d6e7fb}
.c.deco{background:var(--clue) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><g fill='%23274b73' opacity='.22'><path d='M20 4l4 10 10-4-4 10 10 4-10 4 4 10-10-4-4 10-4-10-10 4 4-10-10-4 10-4-4-10 10 4z'/></g><circle cx='20' cy='20' r='3.2' fill='%23c8102e' opacity='.35'/></svg>") center/72% no-repeat}
.c.badge{background:var(--fjord2);color:#fff;font-size:calc(var(--cell)*.15);font-weight:900;text-transform:none;line-height:1.1}
.c.badge b{display:block;font-size:calc(var(--cell)*.36)}
.c.w{cursor:pointer}
.c.w.sel{background:var(--sel)}
.c.w.act{background:var(--act)}
.c.w.act::after{content:'';position:absolute;inset:3px;border-radius:5px;border:2px solid #2f7fd9;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.c.w.drop{background:#ffe9a8}
.c.w .ch{display:inline-block}
.c.w .ch.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.c.w.bad{animation:shake .35s;background:#ffd2d2}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.c.w.done{background:#fff}
.c.w.wave{animation:wave .55s ease-out both}
@keyframes wave{0%{background:var(--snow)}35%{background:#ffe08a;transform:scale(1.12);z-index:3;box-shadow:0 0 0 2px var(--gold)}100%{background:#fff8e0;transform:scale(1)}}
.c.w.hint .ch{color:var(--pine)}

/* ---------- floating fx ---------- */
.fx{position:fixed;z-index:50;pointer-events:none}
.plusN{font-weight:900;color:var(--fjord2);font-size:20px;text-shadow:0 2px 0 #fff;animation:rise 1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.react{left:50%;top:42%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;animation:reactA 1.4s cubic-bezier(.2,1.4,.4,1) forwards}
.react .m{font-size:64px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.react .t{background:#fff;color:var(--fjord2);font-weight:900;font-size:22px;padding:6px 16px;border-radius:16px;box-shadow:0 6px 18px rgba(29,53,87,.3);border:2px solid var(--act)}
@keyframes reactA{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(3deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.flytile{position:fixed;z-index:60;pointer-events:none;transition:transform .28s cubic-bezier(.3,.8,.4,1),opacity .28s}
.spark{position:fixed;z-index:55;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:sp .7s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* ---------- tray ---------- */
.tray{position:relative;z-index:3;display:flex;justify-content:center;gap:8px;padding:10px 8px 4px;min-height:66px}
.tile{width:48px;height:52px;border-radius:10px;background:linear-gradient(180deg,var(--birch) 0%,var(--birch2) 100%);
  box-shadow:0 4px 0 #c9a96a,0 6px 10px rgba(90,62,27,.25);display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--birch-ink);text-transform:uppercase;
  touch-action:none;transition:transform .15s,opacity .2s;position:relative}
.tile::after{content:'';position:absolute;inset:4px;border-radius:7px;border:1px dashed rgba(90,62,27,.18)}
.tile:active,.tile.lift{transform:translateY(-6px) scale(1.06)}
.tile.gone{opacity:0;transform:scale(.4)}
.tile.new{animation:tin .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes tin{from{transform:translateY(30px) scale(.5);opacity:0}}
.tile.drag{position:fixed;z-index:70;pointer-events:none;transform:scale(1.15)}
.tile.ph{visibility:hidden}

/* ---------- tools ---------- */
.tools{position:relative;z-index:3;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 10px calc(env(safe-area-inset-bottom) + 10px)}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--fjord);font-size:11px;font-weight:800;position:relative}
.tool .ic{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 rgba(29,53,87,.18)}
.tool .pr{position:absolute;top:-4px;right:-6px;background:var(--fjord2);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;display:flex;gap:2px;align-items:center}
.tool.big .ic{width:auto;padding:0 20px;background:var(--fjord2);color:#fff;font-size:15px;border-radius:23px}
.tool:disabled{opacity:.45}

/* ---------- home ---------- */
#home .hero{position:relative;z-index:2;text-align:center;padding:calc(env(safe-area-inset-top) + 34px) 16px 0}
#home h1{margin:0;font-size:42px;letter-spacing:.02em;color:var(--fjord);font-weight:900}
#home h1 span{color:var(--berry)}
#home .sub{color:var(--fjord2);font-weight:700;margin-top:4px}
.homecard{position:relative;z-index:2;margin:18px 16px 0;background:rgba(255,255,255,.92);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(29,53,87,.18)}
.play{width:100%;padding:16px;border-radius:18px;background:linear-gradient(180deg,#2f7fd9,#1d5fb0);color:#fff;font-size:21px;font-weight:900;box-shadow:0 5px 0 #154a8a;}
.play small{display:block;font-size:13px;font-weight:700;opacity:.85}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #154a8a}
.lv{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}
.lv button{aspect-ratio:1;border-radius:10px;background:var(--mist);color:var(--fjord);font-weight:900;font-size:15px}
.lv button.done{background:#d9f0e2;color:var(--pine)}
.lv button.cur{background:var(--fjord2);color:#fff;box-shadow:0 0 0 3px var(--act)}
.lv button.lock{opacity:.4}
.row{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;padding:10px;border-radius:14px;background:var(--mist);color:var(--fjord);font-weight:800;font-size:14px}
.chip.on{background:var(--fjord2);color:#fff}
.stats{display:flex;justify-content:space-around;margin-top:12px;color:var(--fjord);font-weight:800;font-size:13px;text-align:center}
.stats b{display:block;font-size:20px}

/* ---------- win ---------- */
#win{background:radial-gradient(circle at 50% 30%,#3b7fd0,#1d3557 75%);color:#fff;align-items:center;justify-content:center}
#win canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#win h2{font-size:36px;margin:0 0 18px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.2);animation:winT .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes winT{from{transform:scale(.3);opacity:0}}
.wcard{display:flex;gap:10px;align-items:center;z-index:2}
.wcard .p{background:#fff;color:var(--fjord);border-radius:16px;padding:10px 18px;text-align:center;font-weight:800;min-width:110px;position:relative}
.wcard .p b{display:block;font-size:30px}
.wcard .p.win{box-shadow:0 0 0 4px var(--gold)}
.wcard .p .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#5a3e00;font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.wcard .vsb{width:44px;height:44px;border-radius:50%;background:#2f7fd9;display:grid;place-items:center;font-weight:900;border:3px solid #fff}
.reward{margin-top:18px;z-index:2;display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;background:rgba(255,255,255,.15);padding:8px 16px;border-radius:16px}
.prog{width:78%;max-width:320px;margin-top:16px;z-index:2;background:rgba(255,255,255,.15);border-radius:14px;padding:10px 12px;font-weight:800;font-size:13px}
.prog .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#7fe3c1,#f2b632);width:0;transition:width 1s .4s}
#win .play{width:78%;max-width:320px;margin-top:22px;z-index:2;background:#fff;color:var(--fjord2);box-shadow:0 5px 0 #a9c3e0}
#win .home{margin-top:12px;background:none;color:#fff;font-weight:800;z-index:2;opacity:.85}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,30,50,.55);display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:22px;padding:20px;width:86%;max-width:340px;text-align:center;animation:winT .35s cubic-bezier(.2,1.4,.4,1)}
.modal h3{margin:0 0 10px;color:var(--fjord)}
.modal .row button{flex:1}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--fjord);color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;z-index:90;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}

.homecard{max-width:460px;margin-left:auto!important;margin-right:auto!important;width:calc(100% - 32px)}
@media(min-width:600px){.homecard{margin-top:28px}}
</style>
</head>
<body>
<template id="skyT">
  <div class="aur"></div>
  <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <path d="M0 150 L40 112 L70 132 L118 78 L150 108 L190 64 L232 112 L262 92 L300 128 L340 86 L400 140 L400 260 L0 260Z" fill="#a9cbe0"/>
    <path d="M118 78 L132 92 L124 92 L140 104 L104 104 L112 92 L104 92Z M190 64 L206 80 L196 80 L214 94 L168 94 L184 80 L176 80Z M340 86 L354 100 L346 100 L360 112 L322 112 L332 100 L326 100Z" fill="#fff" opacity=".9"/>
    <path d="M0 176 L50 140 L92 160 L142 122 L196 158 L250 130 L300 160 L352 132 L400 162 L400 260 L0 260Z" fill="#7fa9c6"/>
    <g fill="#2f6b4f" opacity=".85">
      <path d="M18 182 l7 -18 l7 18z M30 186 l8 -22 l8 22z M352 178 l7 -18 l7 18z M366 184 l8 -22 l8 22z M382 180 l6 -16 l6 16z"/>
    </g>
    <g transform="translate(300 146)" fill="#5a3e1b">
      <path d="M10 30 L10 14 L16 8 L22 14 L22 30Z"/><path d="M6 16 L16 4 L26 16Z" fill="#7a2a1f"/><path d="M12 4 L16 -6 L20 4Z" fill="#7a2a1f"/>
      <rect x="14" y="22" width="4" height="8" fill="#f6e7c8"/>
    </g>
    <path d="M0 190 Q100 176 200 188 T400 186 L400 260 L0 260Z" fill="#dcebf3"/>
  </svg>
</template>

<section id="home" class="screen">
  <div class="sky"><img id="heroimg" src="img/hero.webp" alt="" onerror="this.remove()" style="position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;object-fit:cover;opacity:.95;-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%);mask-image:linear-gradient(180deg,transparent,#000 30%)"></div>
  <div class="hero">
    <h1>Nord<span>kryss</span></h1>
    <div class="sub" id="h-sub"></div>
  </div>
  <div class="homecard">
    <div style="display:flex;justify-content:flex-end;margin:-4px 0 10px"><div class="coins"><span class="coin">✦</span><span class="coinsN" id="h-coins">0</span></div></div>
    <button class="play" id="h-play"></button>
    <div class="lv" id="h-lv"></div>
    <div class="stats"><div><b id="st-solved">0</b><span id="st-solved-l"></span></div><div><b id="st-wins">0</b><span id="st-wins-l"></span></div><div><b id="st-best">0</b><span id="st-best-l"></span></div></div>
    <div class="row"><button class="chip" id="h-lang-ru">🇷🇺 Русский</button><button class="chip" id="h-lang-no">🇳🇴 Norsk</button></div>
    <div class="row"><button class="chip" id="h-snd"></button></div>
    <div id="nk-ver" style="text-align:center;margin-top:10px;font-size:11px;color:#7b8aa0;font-weight:700">v2.1 · test</div>
  </div>
</section>

<section id="game" class="screen">
  <div class="sky"></div>
  <div class="top">
    <button class="ibtn" id="g-back" aria-label="back">‹</button>
    <div class="coins"><span class="coin">✦</span><span class="coinsN">0</span><span class="plus">+</span></div>
    <div style="width:38px"></div>
  </div>
  <div class="vs">
    <div class="pl me"><span id="g-me"></span><span class="sc"><span id="sc-me">0</span></span></div>
    <span class="x">vs</span>
    <div class="pl op"><span class="sc"><span id="sc-op">0</span></span><span id="g-op"></span></div>
  </div>
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <div class="tray" id="tray"></div>
  <div class="tools">
    <button class="tool" id="t-shuffle"><span class="ic">🔄</span><span id="t-sh"></span></button>
    <button class="tool" id="t-word"><span class="ic">🔤</span><span class="pr">✦100</span><span id="t-wd"></span></button>
    <button class="tool" id="t-hint"><span class="ic">💡</span><span class="pr">✦40</span><span id="t-hn"></span></button>
  </div>
</section>

<section id="win" class="screen">
  <canvas id="cf"></canvas>
  <h2 id="w-title"></h2>
  <div class="wcard">
    <div class="p" id="w-mep"><span class="tag" id="w-tag"></span><span id="w-me-l"></span><b id="w-me">0</b></div>
    <div class="vsb">VS</div>
    <div class="p" id="w-opp"><span id="w-op-l"></span><b id="w-op">0</b></div>
  </div>
  <div class="reward"><span class="coin">✦</span><span id="w-reward"></span></div>
  <div class="prog"><span id="w-prog-l"></span> 🎁<div class="bar"><i id="w-bar"></i></div></div>
  <button class="play" id="w-next"></button>
  <button class="home" id="w-home"></button>
</section>

<div class="toast" id="toast"></div>

function mar(f,when,vol){ tone(f,.35,'sine',vol||.22,when); tone(f*4,.08,'sine',(vol||.22)*.25,when); }
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
let combo=0;
const SFX={
  tap(){ noise(.04,.18,2600); },
  pick(){ noise(.05,.22,1400); tone(420,.06,'triangle',.06); },
  place(){ mar(PENTA[Math.min(combo,PENTA.length-1)]); noise(.03,.12,3000); },
  bad(){ tone(180,.22,'square',.07,0,120); tone(140,.25,'sine',.12,.02,90); if(navigator.vibrate)navigator.vibrate(60); },
  word(){ [0,1,2,3,4].forEach((i)=>mar([659.25,783.99,987.77,1174.66,1318.5][i],i*.07,.2)); tone(1568,.5,'sine',.06,.35); },
  opp(){ tone(330,.05,'triangle',.04); },
  win(){ const n=[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5]; n.forEach((f,i)=>{mar(f,i*.12,.24); tone(f/2,.3,'triangle',.06,i*.12)}); setTimeout(()=>noise(.6,.12,5000),900); },
  coin(){ tone(1318.5,.08,'square',.05); tone(1760,.12,'square',.05,.07); },
  shuffle(){ for(let i=0;i<5;i++) noise(.04,.12,1200+i*300); }
};

/* ================= STATE ================= */
let P=null, sol=null, cur=null, solvedCells=null, words=[], selWord=-1, actCell=null, tray=[], score=0, oppScore=0, oppTimer=null, mistakes=0, startT=0, finished=false;
const prog = () => LS.get('prog-'+lang, {done:[], scores:{}, wins:0});
const saveProg = p => LS.set('prog-'+lang, p);

function key(r,c){return r+','+c}

/* ================= HOME ================= */

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }

/* ================= GAME ================= */
function startLevel(i){
  P=DATA[lang].puzzles[i]; P.index=i;
  const H=P.H, W=P.W;
  sol=P.grid.map(r=>r.split(''));
  const saved=LS.get('state-'+lang+'-'+i,null);
  cur=sol.map(r=>r.map(ch=>ch==='#'?'#':''));
  score=0; oppScore=0; mistakes=0; combo=0; finished=false; startT=Date.now();
  if(saved){ cur=saved.cur; score=saved.score; oppScore=saved.opp; }
  words=P.words.map((w,wi)=>{
    const cells=[]; let [r,c]=w.start;
    for(let k=0;k<w.word.length;k++){ cells.push([r,c]); if(w.dir==='a')c++; else r++; }
    return Object.assign({},w,{cells,i:wi});
  });
  buildBoard(); layout(); requestAnimationFrame(fitClues);
  $('#g-me').textContent=t('you'); $('#g-op').textContent=t('opp');
  $('#t-sh').textContent=t('shuffle'); $('#t-wd').textContent=t('word'); $('#t-hn').textContent=t('hint');
  updScores(true); updCoins();
  const first=words.findIndex(w=>!wordDone(w)); selectWord(first<0?0:first);
  refillTray(true);
  show('game');
  if(P.index===0 && !saved) toast(t('daily'),3200);
  startOpp();
  if(isComplete()) finish();
}

function buildBoard(){
  const b=$('#board'); b.innerHTML='';
  b.style.gridTemplateColumns=`repeat(${P.W},var(--cell))`;
  const hosts={};
  words.forEach(w=>{ (hosts[key(...w.clue)]=hosts[key(...w.clue)]||{})[w.dir]=w; });
  for(let r=0;r<P.H;r++) for(let c=0;c<P.W;c++){
    const d=document.createElement('div'); d.className='c'; d.dataset.r=r; d.dataset.c=c;
    if(sol[r][c]==='#'){
      const h=hosts[key(r,c)];
      if(r===0&&c===0){ d.classList.add('badge'); d.innerHTML=`${t('level')}<b>${P.index+1}</b>`; }
      else if(!h){ d.classList.add('deco'); }
      else{
        d.classList.add('k');
        const parts=[h.a,h.d].filter(Boolean);
        if(parts.length===1){ d.innerHTML=`<div class="full">${clueHTML(parts[0])}</div>`; }
        else{ d.innerHTML=`<div class="half t">${clueHTML(h.a)}</div><div class="half b">${clueHTML(h.d)}</div>`; }
        if(h.a) d.insertAdjacentHTML('beforeend',`<i class="ar r" style="top:${parts.length>1?'22%':'calc(50% - 4px)'}"></i>`);
        if(h.d) d.insertAdjacentHTML('beforeend',`<i class="ar d" style="left:calc(50% - 4px)"></i>`);
        d.onclick=()=>{ SFX.tap(); const ws=parts.map(p=>p.i); const at=ws.indexOf(selWord); selectWord(ws[(at+1)%ws.length]); };
      }
    } else {
      d.classList.add('w');
      d.innerHTML=`<span class="ch">${cur[r][c]||''}</span>`;
      if(cur[r][c]) d.classList.add('done');
      d.onclick=()=>onCellTap(r,c);
    }
    b.appendChild(d);
  }
}
function clueHTML(w){
  if(w.img){
    const em=EMOJI[w.img]||'';
    return `<img src="${IMGS[w.img]||('img/'+w.img+'.webp')}" alt="" onerror="this.outerHTML='<span class=&quot;emo&quot;>${em}</span>'">`;
  }
  return `<span>${(w.text||w.word).replace(/\s+/g,' ')}</span>`;
}
function cellEl(r,c){ return $(`#board .c[data-r="${r}"][data-c="${c}"]`); }
function layout(){
  const vw=Math.min(window.innerWidth,520), vh=window.innerHeight;
  const avH=vh-($('#game .top').offsetHeight||56)-($('#game .vs').offsetHeight||36)-66-86-24;
  const cs=Math.floor(Math.min((vw-16)/P.W,(avH)/P.H));
  document.documentElement.style.setProperty('--cell',Math.max(30,Math.min(cs,58))+'px');
}
window.addEventListener('resize',()=>{ if(P&&$('#game').classList.contains('on')){ layout(); fitClues(); } });
function fitClues(){
  document.querySelectorAll('#board .c.k .full>span:not(.emo), #board .c.k .half>span:not(.emo)').forEach(sp=>{
    const box=sp.parentElement; sp.style.fontSize=''; let fs=parseFloat(getComputedStyle(sp).fontSize), n=0;
    sp.style.display='block'; sp.style.wordBreak='break-word'; sp.style.hyphens='auto';
    while((sp.scrollHeight>box.clientHeight-2||sp.scrollWidth>box.clientWidth-2)&&fs>5&&n++<14){ fs-=.5; sp.style.fontSize=fs+'px'; }
  });
}

function wordDone(w){ return w.cells.every(([r,c])=>cur[r][c]); }
function isComplete(){ return words.every(wordDone); }
function selectWord(i,cell){
  selWord=i;
  document.querySelectorAll('#board .c.sel,#board .c.act').forEach(e=>e.classList.remove('sel','act'));
  if(i<0) return;
  const w=words[i];
  w.cells.forEach(([r,c])=>cellEl(r,c).classList.add('sel'));
  cellEl(...w.clue).classList.add('sel');
  actCell = cell || w.cells.find(([r,c])=>!cur[r][c]) || w.cells[0];
  cellEl(...actCell).classList.add('act');
  refillTray(false);
}
function onCellTap(r,c){
  SFX.tap();
  const ws=words.filter(w=>w.cells.some(([a,b])=>a===r&&b===c));
  if(!ws.length) return;
  let pick=ws[0];
  if(ws.length>1){
    const inSel=ws.find(w=>w.i===selWord);
    if(inSel && actCell && actCell[0]===r && actCell[1]===c) pick=ws.find(w=>w.i!==selWord);
    else if(inSel) pick=inSel;
    else pick=ws.find(w=>!wordDone(w))||ws[0];
  }
  selectWord(pick.i,[r,c]);
}

/* ---------- tray ---------- */
function neededCells(){
  const out=[];
  const w=words[selWord];
  const seen=new Set();
  if(w) w.cells.forEach(([r,c])=>{ if(!cur[r][c]){ out.push([r,c]); seen.add(key(r,c)); } });
  const rest=[];
  for(let r=0;r<P.H;r++) for(let c=0;c<P.W;c++) if(sol[r][c]!=='#'&&!cur[r][c]&&!seen.has(key(r,c))) rest.push([r,c]);
  rest.sort(()=>Math.random()-.5);
  return out.concat(rest);
}
function refillTray(full){
  const cap=6;
  const need=neededCells();
  // keep tiles whose letters are still needed somewhere
  const counts={}; need.forEach(([r,c])=>{const ch=sol[r][c];counts[ch]=(counts[ch]||0)+1});
  if(!full){ tray=tray.filter(ch=>{ if(counts[ch]>0){counts[ch]--;return true} return false; }); }
  else tray=[];
  // ensure the active cell letter is present
  const want=[];
  if(actCell && !cur[actCell[0]][actCell[1]]) want.push(sol[actCell[0]][actCell[1]]);
  need.forEach(([r,c])=>want.push(sol[r][c]));
  const have={}; tray.forEach(ch=>have[ch]=(have[ch]||0)+1);
  const add=[];
  for(const ch of want){
    if(tray.length+add.length>=cap) break;
    if(have[ch]>0){ have[ch]--; continue; }
    add.push(ch);
  }
  // active letter must be in tray: if missing, replace last
  const actCh = actCell && !cur[actCell[0]][actCell[1]] ? sol[actCell[0]][actCell[1]] : null;
  let fresh = full? add : add;
  tray = tray.concat(add);
  if(actCh && !tray.includes(actCh)){ tray[tray.length-1]=actCh; }
  if(full||add.length) tray = tray.map((ch,i)=>ch); // keep order, new at end
  renderTray(full?tray.length:add.length);
}
function renderTray(nNew){
  const el=$('#tray'); el.innerHTML='';
  tray.forEach((ch,i)=>{
    const d=document.createElement('div'); d.className='tile'+(i>=tray.length-nNew?' new':''); d.textContent=ch; d.dataset.i=i;
    d.style.animationDelay=(i>=tray.length-nNew? (i-(tray.length-nNew))*.05:0)+'s';
    attachDrag(d,i);
    el.appendChild(d);
  });
}
function attachDrag(d,i){
  let sx,sy,drag=null,moved=false,over=null;
  d.addEventListener('pointerdown',e=>{
    if(finished) return;
    ac(); sx=e.clientX; sy=e.clientY; moved=false; d.setPointerCapture(e.pointerId); d.classList.add('lift'); SFX.pick();
  });
  d.addEventListener('pointermove',e=>{
    if(sx==null) return;
    if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)>8){
      moved=true; drag=d.cloneNode(true); drag.classList.add('drag'); drag.classList.remove('new','lift');
      document.body.appendChild(drag); d.classList.add('ph');
    }
    if(moved){
      drag.style.left=(e.clientX-24)+'px'; drag.style.top=(e.clientY-60)+'px';
      const el=document.elementFromPoint(e.clientX,e.clientY-34);
      const cell=el&&el.closest&&el.closest('.c.w');
      if(over&&over!==cell) over.classList.remove('drop');
      over=cell; if(over&&!cur[+over.dataset.r][+over.dataset.c]) over.classList.add('drop');
    }
  });
  const end=e=>{
    if(sx==null) return; sx=null; d.classList.remove('lift');
    if(moved){
      if(drag) drag.remove(); d.classList.remove('ph');
      if(over){ over.classList.remove('drop'); const r=+over.dataset.r,c=+over.dataset.c; if(!cur[r][c]) tryPlace(i,[r,c],null); }
      over=null;
    } else {
      if(actCell) tryPlace(i,actCell,d);
    }
  };
  d.addEventListener('pointerup',end); d.addEventListener('pointercancel',end);
}
function flyTile(fromEl,toEl,ch,cb){
  if(!fromEl){cb();return}
  const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const f=fromEl.cloneNode(true); f.className='tile flytile'; f.textContent=ch;
  f.style.left=a.left+'px'; f.style.top=a.top+'px'; f.style.width=a.width+'px'; f.style.height=a.height+'px';
  document.body.appendChild(f); fromEl.classList.add('gone');
  requestAnimationFrame(()=>{ f.style.transform=`translate(${b.left-a.left+(b.width-a.width)/2}px,${b.top-a.top+(b.height-a.height)/2}px) scale(${b.width/a.width})`; f.style.opacity='.0'; });
  setTimeout(()=>{f.remove();cb()},260);
}
function tryPlace(ti,cell,tileEl){
  const [r,c]=cell, ch=tray[ti], el=cellEl(r,c);
  if(cur[r][c]) return;
  if(sol[r][c]===ch){
    flyTile(tileEl,el,ch,()=>{
      cur[r][c]=ch; combo++;
      el.innerHTML=`<span class="ch pop">${ch}</span>`; el.classList.add('done');
      SFX.place(); sparks(el,6,'#f2b632');
      addScore(1,el,false);
      tray.splice(ti,1);
      afterPlace(r,c);
    });
  } else {
    combo=0; mistakes++;
    SFX.bad(); el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
    if(tileEl){ tileEl.classList.remove('lift'); tileEl.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:240}); }
    setTimeout(()=>el.classList.remove('bad'),400);
  }
}
function afterPlace(r,c){
  const done=words.filter(w=>w.cells.some(([a,b])=>a===r&&b===c)&&wordDone(w));
  let delay=0;
  done.forEach(w=>{ celebrateWord(w,delay); delay+=250; });
  save();
  if(isComplete()){ setTimeout(finish, 900+delay); return; }
  // advance cursor
  const w=words[selWord];
  if(w && !wordDone(w)){
    const idx=w.cells.findIndex(([a,b])=>a===r&&b===c);
    const nxt=w.cells.slice(idx+1).find(([a,b])=>!cur[a][b])||w.cells.find(([a,b])=>!cur[a][b]);
    selectWord(selWord,nxt);
  } else {
    const nxtW=nextWord();
    if(done.length){ actCell=null; refillTray(false); setTimeout(()=>selectWord(nxtW),420); } else selectWord(nxtW);
  }
}
function nextWord(){
  const n=words.length;
  // prefer words crossing the just-finished one, then any
  for(let k=1;k<=n;k++){ const i=(selWord+k)%n; if(!wordDone(words[i])) return i; }
  return -1;
}
function celebrateWord(w,delay){
  setTimeout(()=>{
    SFX.word(); combo=Math.min(combo+1,7);
    w.cells.forEach(([r,c],k)=>{ const e=cellEl(r,c); setTimeout(()=>{e.classList.remove('wave');void e.offsetWidth;e.classList.add('wave')},k*55); });
    const last=cellEl(...w.cells[w.cells.length-1]);
    setTimeout(()=>{ addScore(w.word.length,last,true); sparks(last,14,'#7fe3c1'); },w.cells.length*55);
    if(w.word.length>=5 || Math.random()<.35) react();
  },delay);
}
function react(){
  const d=document.createElement('div'); d.className='fx react';
  const R=t('react'); const M=MASCOTS[Math.floor(Math.random()*MASCOTS.length)];
  d.innerHTML=`<div class="m"><img src="${IMGS['mascot_'+M[0]]||('img/mascot_'+M[0]+'.webp')}" alt="" style="width:96px;height:96px" onerror="this.outerHTML='${M[1]}'"></div><div class="t">${R[Math.floor(Math.random()*R.length)]}</div>`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1450);
}
function sparks(el,n,color){
  const b=el.getBoundingClientRect();
  for(let i=0;i<n;i++){
    const s=document.createElement('i'); s.className='spark';
    const a=Math.random()*Math.PI*2, d=20+Math.random()*30;
    s.style.left=(b.left+b.width/2)+'px'; s.style.top=(b.top+b.height/2)+'px'; s.style.background=i%2?color:'#fff';
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),720);
  }
}
function addScore(n,el,big){
  score+=n; updScores();
  const b=el.getBoundingClientRect(), f=document.createElement('div');
  f.className='fx plusN'; f.textContent='+'+n; f.style.left=(b.left+b.width/2)+'px'; f.style.top=(b.top-4)+'px';
  if(big){ f.style.fontSize='26px'; f.style.color='#c8102e'; }
  document.body.appendChild(f); setTimeout(()=>f.remove(),1000);
}
let shownMe=0, shownOp=0;
function updScores(instant){
  const me=$('#sc-me'), op=$('#sc-op');
  if(instant){ shownMe=score; shownOp=oppScore; me.textContent=score; op.textContent=oppScore; return; }
  if(shownMe!==score){ me.parentElement.classList.add('bump'); setTimeout(()=>me.parentElement.classList.remove('bump'),200); }
  if(shownOp!==oppScore){ op.parentElement.classList.add('bump'); setTimeout(()=>op.parentElement.classList.remove('bump'),200); }
  tween(me,shownMe,score); tween(op,shownOp,oppScore); shownMe=score; shownOp=oppScore;
}
function tween(el,a,b){ const t0=performance.now(); const f=now=>{const k=Math.min(1,(now-t0)/350); el.textContent=Math.round(a+(b-a)*k); if(k<1)requestAnimationFrame(f)}; requestAnimationFrame(f); }

/* ---------- opponent ---------- */
function startOpp(){
  clearInterval(oppTimer);
  const total=P.grid.join('').replace(/#/g,'').length + words.reduce((a,w)=>a+w.word.length,0);
  const target=Math.round(total*(0.55+Math.min(P.index,20)*0.012));   // bot's final-ish score
  const dur=(140+P.index*4)*1000;  // ms to reach target
  const step=1800;
  oppTimer=setInterval(()=>{
    if(finished||document.hidden||!$('#game').classList.contains('on')) return;
    if(oppScore>=target) return;
    const inc = Math.random()<.18 ? 3+Math.floor(Math.random()*4) : (Math.random()<.7?1:0);
    if(!inc) return;
    oppScore=Math.min(target,oppScore+Math.max(1,Math.round(inc*target/(dur/step)/1.1)));
    SFX.opp(); updScores(); save();
  },step);
}

/* ---------- tools ---------- */
function spend(n){ if(coins<n){ toast(t('nocoins')); SFX.bad(); return false } coins-=n; LS.set('coins',coins); updCoins(); SFX.coin(); return true; }
function updCoins(){ document.querySelectorAll('.coinsN').forEach(e=>e.textContent=coins); }
function toolShuffle(){ if(finished)return; SFX.shuffle(); tray=[]; refillTray(true); tray.sort(()=>Math.random()-.5); renderTray(tray.length); }
function revealCell(r,c){
  const el=cellEl(r,c); cur[r][c]=sol[r][c];
  el.innerHTML=`<span class="ch pop">${sol[r][c]}</span>`; el.classList.add('done','hint'); sparks(el,8,'#2f6b4f');
}
function toolHint(){
  if(finished||!actCell||cur[actCell[0]][actCell[1]]) return;
  if(!spend(40)) return;
  const [r,c]=actCell; revealCell(r,c); SFX.place();
  const i=tray.indexOf(sol[r][c]); if(i>=0) tray.splice(i,1);
  afterPlace(r,c);
}
function toolWord(){
  if(finished||selWord<0) return; const w=words[selWord]; if(wordDone(w)) return;
  if(!spend(100)) return;
  let last=null;
  w.cells.forEach(([r,c],k)=>{ if(!cur[r][c]){ revealCell(r,c); last=[r,c]; const i=tray.indexOf(sol[r][c]); if(i>=0)tray.splice(i,1);} });
  SFX.place(); if(last) afterPlace(...last);
}

function save(){ if(!P) return; LS.set('state-'+lang+'-'+P.index,{cur,score,opp:oppScore}); }

/* ---------- finish ---------- */
function finish(){
  if(finished) return; finished=true; clearInterval(oppTimer);
  const pr=prog(); const won=score>=oppScore;
  if(!pr.done.includes(P.index)) pr.done.push(P.index);
  pr.scores=pr.scores||{}; pr.scores[P.index]=Math.max(pr.scores[P.index]||0,score);
  if(won) pr.wins=(pr.wins||0)+1;
  saveProg(pr); LS.set('state-'+lang+'-'+P.index,null);
  const reward=won?60:25; coins+=reward; LS.set('coins',coins);
  $('#w-title').textContent=won?t('win'):t('lose');
  $('#w-me-l').textContent=t('you'); $('#w-op-l').textContent=t('opp');
  $('#w-me').textContent=score; $('#w-op').textContent=oppScore;
  $('#w-mep').classList.toggle('win',won); $('#w-opp').classList.toggle('win',!won);
  $('#w-tag').textContent=t('winner'); $('#w-tag').style.display='block';
  $('#w-mep').appendChild($('#w-tag')); if(!won) $('#w-opp').appendChild($('#w-tag'));
  $('#w-reward').textContent='+'+reward;
  const w3=(pr.wins||0)%3; $('#w-prog-l').textContent=`${t('wins')} ${w3===0&&won?3:w3} / 3 ${t('chest')}`;
  $('#w-next').innerHTML=`${t('next')}<small>${t('level')} ${Math.min(P.index+2,DATA[lang].puzzles.length)}</small>`;
  $('#w-home').textContent=t('home');
  setTimeout(()=>{ show('win'); SFX.win(); confetti(); $('#w-bar').style.width='0'; setTimeout(()=>$('#w-bar').style.width=((w3===0&&won?3:w3)/3*100)+'%',50); },150);
}
function confetti(){
  const cv=$('#cf'), x=cv.getContext('2d'); const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#f2b632','#c8102e','#7fe3c1','#9fd0ff','#ffffff','#2f7fd9','#ff9fb2'];
  const ps=Array.from({length:180},()=>({x:Math.random()*W,y:-Math.random()*H*.6,w:(6+Math.random()*8)*devicePixelRatio,h:(4+Math.random()*6)*devicePixelRatio,
    vy:(2+Math.random()*4)*devicePixelRatio,vx:(Math.random()-.5)*2*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(now){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx+Math.sin(now/300+p.a)*.6;p.y+=p.vy;p.a+=p.va; x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.a)));x.restore();});
    if(now-t0<5200 && $('#win').classList.contains('on')) requestAnimationFrame(f); else x.clearRect(0,0,W,H);
  })(t0);
}
function toast(msg,ms){ const e=$('#toast'); e.textContent=msg; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),ms||1600); }

/* ---------- snow ---------- */
function snow(host,n){ for(let i=0;i<n;i++){ const s=document.createElement('i'); s.className='flake'; s.textContent='❄'; s.style.left=Math.random()*100+'%';
  s.style.fontSize=(6+Math.random()*10)+'px'; s.style.animationDuration=(8+Math.random()*10)+'s'; s.style.animationDelay=(-Math.random()*16)+'s'; s.style.opacity=.4+Math.random()*.5; host.appendChild(s);} }

/* ---------- wiring ---------- */
$('#g-back').onclick=()=>{ SFX.tap(); clearInterval(oppTimer); save(); renderHome(); };
$('#t-shuffle').onclick=toolShuffle; $('#t-word').onclick=toolWord; $('#t-hint').onclick=toolHint;
$('#w-next').onclick=()=>{ SFX.tap(); const n=Math.min(P.index+1,DATA[lang].puzzles.length-1); startLevel(n); };
$('#w-home').onclick=()=>{ SFX.tap(); renderHome(); };
$('#h-lang-ru').onclick=()=>{ lang='ru'; LS.set('lang',lang); SFX.tap(); renderHome(); };
$('#h-lang-no').onclick=()=>{ lang='no'; LS.set('lang',lang); SFX.tap(); renderHome(); };
$('#h-snd').onclick=()=>{ soundOn=!soundOn; LS.set('sound',soundOn); SFX.tap(); renderHome(); };
document.querySelectorAll('.sky').forEach(s=>snow(s,14));
window.NK={startLevel,renderHome,get state(){return {P,sol,cur,words,selWord,actCell,tray,score,oppScore,finished}},finish,tryPlace,toolHint,toolWord};
try{const h=document.getElementById('heroimg'); if(h&&IMGS.hero) h.src=IMGS.hero;}catch(e){}
renderHome();
})();
</script>
