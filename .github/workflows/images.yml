name: Generate illustrations (xAI)
on:
  workflow_dispatch:
    inputs:
      only:
        description: "IDs to (re)generate, space separated (empty = all missing)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python tools/gen_images.py ${{ github.event.inputs.only }}
      - name: Commit images
        run: |
          git config user.name "nordkryss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Add illustrations"
          git push
